name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum (TH-5).
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, ktlint, coverage
        run: ./gradlew :core:check :core:koverXmlReport

      - name: Requirement traceability
        run: python3 scripts/traceability.py --check

      - name: Manifest checker fixtures (SR-20)
        run: python3 scripts/test_check_manifest.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-reports
          path: |
            core/build/reports/
            core/build/test-results/

  app:
    name: app (build, lint, manifest check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Builds whisper.cpp with the NDK; the merged-manifest check enforces SR-20 (no INTERNET,
      # nothing exported but the launcher activity).
      - name: Build, ktlint, manifest check
        run: ./gradlew :app:assembleDebug :app:ktlintCheck :vehicle:car:testDebugUnitTest :vehicle:car:ktlintCheck :native:whisper:ktlintCheck :native:llama:ktlintCheck :app:verifyDebugMergedManifest :app:verifyReleaseMergedManifest
