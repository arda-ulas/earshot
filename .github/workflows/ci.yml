name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum (TH-5).
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, ktlint, coverage
        run: ./gradlew :core:check :core:koverXmlReport

      - name: Requirement traceability
        run: python3 scripts/traceability.py --check

      - name: Manifest checker fixtures (SR-20)
        run: python3 scripts/test_check_manifest.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-reports
          path: |
            core/build/reports/
            core/build/test-results/


  # Text-level regression gate: the car suite's own reference transcripts through core's rules and
  # policy, gated against harness/baseline.json. No models are downloaded and no audio is used, so
  # speech-to-text and the language model are not tested here (docs/harness/README.md).
  harness:
    name: harness (text-level gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Harness unit tests and ktlint
        run: ./gradlew :harness:check

      - name: Reference run (text, no models)
        run: ./gradlew :harness:run --args="run --suite testset/car --engine reference --lm none --out reports/ref"

      # --allow-partial: this job runs only the text group, so the baseline's audio groups (run locally)
      # are listed as not compared instead of failing. Every other gate applies in full.
      - name: Gates against the baseline
        run: ./gradlew :harness:run --args="compare --baseline harness/baseline.json --report reports/ref/report.json --allow-partial"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-reports
          path: |
            harness/build/reports/
            harness/build/test-results/
            reports/ref/

  app:
    name: app (build, lint, manifest check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Builds whisper.cpp with the NDK; the merged-manifest check enforces SR-20 (no INTERNET,
      # nothing exported but the launcher activity).
      - name: Build, ktlint, manifest check
        run: ./gradlew :app:assembleDebug :app:ktlintCheck :vehicle:car:testDebugUnitTest :vehicle:car:ktlintCheck :native:whisper:ktlintCheck :native:llama:ktlintCheck :app:verifyDebugMergedManifest :app:verifyReleaseMergedManifest
