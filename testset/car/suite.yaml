# Car test set: short cabin-climate requests, rendered with macOS `say` and mixed with generated noise.
# Format: docs/test-set-format.md. Labels: labels.jsonl (synthetic voices), labels-recorded.jsonl
# (the author's own voice, pending). Audio and noise are generated by scripts/make-testset.sh and are
# not committed.
name: car
domain: cabin climate (temperature, fan, defrost, AC), driving queries, conversation control

audio:
  format: WAV
  sample_rate_hz: 16000
  channels: 1
  sample_width_bits: 16

# Where each clip lives, relative to testset/car/audio/:
#   clean/<audio>                    synthetic speech, no noise added
#   snr<snr>/<noise>/<audio>         the clean clip mixed with one noise profile at that SNR
#   recorded/<audio>                 the author's own voice (labels-recorded.jsonl), no noise added
noisy_audio: "snr{snr}/{noise}/{audio}"

voices: [Samantha, Daniel, Karen, Moira]

# Noise profiles. All three are generated by scripts/make-testset.sh in pure Python with fixed seeds:
# no downloads and no third-party audio. Each is 30 s at 16 kHz mono, normalised to -26 dBFS RMS.
noise:
  - name: pink
    method: >-
      Gaussian white noise (Python random.Random(seed).gauss) through Paul Kellet's refined
      pinking filter (about -3 dB per octave)
    seed: 1001
    licence: generated by this script, no third-party audio
  - name: brown
    method: >-
      Gaussian white noise integrated with a leaky integrator (coefficient 0.998), then a one-pole
      DC-blocking high-pass (about -6 dB per octave above roughly 5 Hz)
    seed: 1002
    licence: generated by this script, no third-party audio
  - name: fan
    method: >-
      Fan-like hum: a 97 Hz fundamental with harmonics 2 to 6 (amplitude 1/k^1.2, seeded random
      phases, slow pitch wobble), plus seeded white noise through a one-pole low-pass at about
      800 Hz, with a 0.3 Hz amplitude modulation of 10 percent
    seed: 1003
    licence: generated by this script, no third-party audio

# SNR is speech power over noise power. Speech power is measured over the active part of the clean
# clip (20 ms frames within 30 dB of the loudest frame), so leading and trailing silence does not
# lower it. The noise segment starts at a random offset seeded from "<clip id>/<noise>/<snr>".
snr_db: [20, 10, 5]

# The policy's inputs other than the driving state and the engine's confidence.
context:
  # Unknown is handled as on by the policy, so "turn the fan off" counts as visibility-reducing.
  front_defrost: unknown

thresholds:
  confidence: 0.5
  # Fixed gates, stated here for the reader; the harness does not let them be loosened.
  policy_correctness: 1.0
  false_action_rate: 0
  # Regression gates against harness/baseline.json, in percentage points, at every SNR.
  max_intent_drop_points: 2
  max_wer_rise_points: 3
